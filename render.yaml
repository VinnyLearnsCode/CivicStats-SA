services:
  - type: web
    name: civicstats-sa
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicstats-sa-db
          property: connectionString
      - key: CIVICSTATS_ADMIN_TOKEN
        generateValue: true
  - type: worker
    name: civicstats-import-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicstats-sa-db
          property: connectionString

databases:
  - name: civicstats-sa-db
    plan: basic-256mb
    databaseName: civicstats_sa
    user: civicstats_sa
